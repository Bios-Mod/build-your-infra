# Deploy to:   vm:ec2
# Apply:       triggered via notify from file-transfer tasks
# Module:      file-transfer
# Requires:    none
#
# Service handlers for the file-transfer role.
# Why:         Ensures affected daemons (sshd) and integrity baselines (AIDE) absorb configuration changes idempotently.
# Doc ref:     modules/file-transfer/self-managed/file-transfer-self-managed.md — Steps 4, 6
# Targets:     both

---
# Reloads OpenSSH server daemon to apply file-transfer drop-in configuration (Step 4)
- name: Reload sshd (file-transfer)
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

# Initializes updated AIDE database baseline for file-transfer chroot paths (Step 6)
- name: Initialize AIDE database (file-transfer)
  ansible.builtin.command:
    cmd: aide --init --config /etc/aide/aide.conf
  register: file_transfer_aide_init
  failed_when: file_transfer_aide_init.rc not in [0, 17]
  changed_when: true
  when: not ansible_check_mode
  listen: Regenerate AIDE database (file-transfer)

# Activates the newly initialized AIDE database baseline (Step 6)
- name: Activate AIDE database (file-transfer)
  ansible.builtin.command:
    cmd: mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db
  changed_when: true
  when: not ansible_check_mode
  listen: Regenerate AIDE database (file-transfer)
