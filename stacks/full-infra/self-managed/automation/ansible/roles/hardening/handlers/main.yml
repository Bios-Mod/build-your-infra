# Deploy to:   vm:ec2
# Apply:       triggered via notify from hardening tasks
# Module:      hardening
# Requires:    none
#
# Service handlers for the hardening role.
# Why:         Ensures affected daemons absorb configuration changes idempotently at play boundaries.
# Doc ref:     modules/hardening/self-managed/hardening-self-managed.md — Steps 1, 2, 3, 4, 5, 6, 7, 9, 11
# Targets:     both

---
# Applies Netplan network configuration asynchronously to prevent SSH disconnection during re-addressing (Step 2)
- name: Apply netplan
  ansible.builtin.command:
    cmd: netplan apply
  async: 30
  poll: 0
  changed_when: true
  when: not is_cloud

# Reloads systemd daemon to recognize dropped-in network unit files from Step 2
- name: Reload systemd daemon
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not is_cloud

# Restarts systemd-networkd to apply drop-in configuration from Step 2
- name: Restart systemd-networkd
  ansible.builtin.systemd_service:
    name: systemd-networkd
    state: restarted
  when: not is_cloud

# Restarts the OpenSSH server to apply hardened configuration from Step 3
- name: Restart sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted

# Reloads UFW rules to enforce updated firewall and sysctl policies from Step 4 and Step 5
- name: Reload ufw
  community.general.ufw:
    state: reloaded

# Restarts unattended-upgrades to load daily update intervals from Step 1
- name: Restart unattended-upgrades
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    state: restarted

# Restarts WireGuard VPN tunnel to apply wg0.conf updates from Step 5
- name: Restart wireguard
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    state: restarted

# Restarts Fail2Ban service to apply jail.local and aggressive filters from Step 6
- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted

# Reloads kernel runtime parameters from all /etc/sysctl.d/ files from Step 7
- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

# Rebuilds the initial ramdisk to enforce kernel module blacklisting from Step 9.3
- name: Update-initramfs
  ansible.builtin.command:
    cmd: update-initramfs -u
  changed_when: false

# Restarts rsyslog daemon to bind new dedicated log channels from Step 11
- name: Restart rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
    state: restarted
