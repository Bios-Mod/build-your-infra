# Deploy to:   vm:ec2
# Apply:       included automatically when role 'hardening' is invoked
# Module:      hardening
# Requires:    none
#
# Default variable definitions for the hardening role.
# Why:         Provides baseline defaults for administration, package updates, network, and validation.
# Doc ref:     modules/hardening/self-managed/hardening-self-managed.md — Steps 0, 1, 2, 10, 12
# Targets:     both

---
# ==============================================================================
# Step 0 — Admin User Setup
# ==============================================================================

# Name of the non-root administrative user created in Step 0
hardening_admin_username: "{{ admin_username | default('admin') }}"

# Login shell assigned to the administrator
hardening_admin_shell: "{{ admin_shell | default('/bin/bash') }}"

# Supplementary groups granted to the administrative user
hardening_admin_groups: "{{ admin_groups | default(['sudo', 'adm', 'admin']) }}"

# Path to the administrator SSH Ed25519 public key file on the local control node
hardening_admin_public_key_file: "{{ admin_public_key_file | default('~/.ssh/id_ed25519.pub') }}"

# Hashed administrator password for user creation (dynamically passed from vars_prompt in bootstrap.yml)
hardening_admin_password_hash: ""

# Root directory containing the source-of-truth hardening configs
hardening_configs_dir: "{{ configs_root }}/hardening/self-managed/configs"

# ==============================================================================
# Step 1 — System Update & Package Hygiene
# ==============================================================================

# Whether to update the APT cache before running upgrades
hardening_update_cache: true

# Cache validity duration in seconds to avoid redundant repository lookups
hardening_cache_valid_time: 3600

# APT upgrade strategy applied during system initialization ('full', 'safe', or 'dist')
hardening_upgrade_type: "full"

# Base package hygiene and automated patch management packages to install
hardening_base_packages:
  - unattended-upgrades
  - debsums
  - apt-show-versions
  - apt-listchanges

# Packages purged during system cleanup (defaults to empty in Step 1 baseline)
hardening_purge_packages: []

# Daemon services disabled during baseline preparation (defaults to empty in Step 1)
hardening_disable_services: []

# ==============================================================================
# Step 2 — Static IP Configuration (VM only)
# ==============================================================================

# Network interface on the local VM target configured in Step 2 (must be defined in host_vars)
hardening_vm_interface: "{{ vm_interface }}"

# Static IPv4 address and CIDR prefix for the local VM (must be defined in host_vars)
hardening_vm_static_ip: "{{ vm_static_ip }}"

# Default gateway IPv4 address for the local VM (must be defined in host_vars)
hardening_vm_gateway: "{{ vm_gateway }}"

# Local LAN CIDR permitted to access administrative services
hardening_lan_trusted_cidr: "{{ lan_trusted_cidr | default('') }}"

# ==============================================================================
# Block 2B — Access Chain (Steps 3, 4, 5, 6)
# ==============================================================================

# Target hardened SSH port configured in Step 3
hardening_ssh_port: "{{ ssh_hardened_port | default(22222) }}"

# UFW default incoming and outgoing firewall policies (Step 4)
hardening_ufw_default_incoming_policy: "deny"
hardening_ufw_default_outgoing_policy: "allow"

# UFW packet logging verbosity (Step 4)
hardening_ufw_logging: "medium"

# WireGuard topology role: 'hub' on EC2, 'client' on VM (Step 5)
hardening_wireguard_role: "{{ wireguard_role | default('hub' if is_cloud else 'client') }}"

# WireGuard UDP listen port (Step 5)
hardening_wireguard_port: "{{ wireguard_port | default(51820) }}"

# WireGuard VPN subnet (Step 5)
hardening_wireguard_subnet: "{{ wireguard_subnet | default('172.16.0.0/24') }}"

# WireGuard hub VPN address (Step 5)
hardening_wireguard_hub_vpn_ip: "{{ wireguard_server_vpn_ip | default('172.16.0.1/24') }}"

# WireGuard local VM peer VPN address (Step 5)
hardening_wireguard_vm_vpn_ip: "{{ wireguard_vm_vpn_ip | default('172.16.0.3/32') }}"

# WireGuard hub public key configured on client peers (Step 5)
hardening_wireguard_hub_public_key: "{{ wireguard_hub_public_key | default('') }}"

# Mapping of authorized WireGuard peer public keys configured on hub (Step 5)
hardening_wireguard_peer_public_keys: "{{ wireguard_peer_public_keys | default({}) }}"

# WireGuard public endpoint for remote clients (Step 5)
hardening_wireguard_endpoint: "{{ wireguard_endpoint | default('') }}"

# Whether to close public/LAN SSH port 22222 after confirming WireGuard tunnel access (Step 5)
# Set to false by default for safety; switch to true only after tunnel connectivity is verified
hardening_wg_close_public_ssh: false

# Fail2Ban default ban parameters (Step 6)
hardening_fail2ban_bantime: 86400
hardening_fail2ban_findtime: 300
hardening_fail2ban_maxretry: 3
hardening_fail2ban_ssh_bantime: 172800

# ==============================================================================
# Compliance and Validation (Steps 10 and 12)
# ==============================================================================

# Auditd immutable flag (-e 2) from Step 10. Default true matches baseline; overridden to false in vm.yml during development.
hardening_auditd_immutable_mode: true

# Lynis minimum Hardening Index threshold expected for VM target host (Step 12 baseline; EC2 overrides to 90)
hardening_lynis_min_score: 88

# Whether to fail the playbook execution if Lynis score is below threshold (false: records score and warns)
hardening_lynis_enforce: false
