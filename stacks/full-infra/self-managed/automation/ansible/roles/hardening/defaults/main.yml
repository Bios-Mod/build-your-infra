# Deploy to:   vm:ec2
# Apply:       included automatically when role 'hardening' is invoked
# Module:      hardening
# Requires:    none
#
# Default variable definitions for the hardening role.
# Why:         Provides safe defaults for user accounts, ports, network rules, and audit parameters.
# Doc ref:     modules/hardening/self-managed/hardening-self-managed.md — Steps 0 to 12
# Targets:     both

---
# Name of the non-root administrative user created in Step 0
hardening_admin_username: "{{ admin_username | default('admin') }}"

# Supplementary groups granted to the administrative user for sudo privilege escalation
hardening_admin_groups: "{{ admin_groups | default(['sudo', 'adm']) }}"

# Port assigned to the OpenSSH server in Step 3 (replaces default port 22)
hardening_ssh_hardened_port: "{{ ssh_hardened_port | default(22222) }}"

# Grace time in seconds before an unauthenticated SSH connection is terminated
hardening_ssh_login_grace_time: 30

# Maximum number of authentication attempts per connection before drop
hardening_ssh_max_auth_tries: 3

# Maximum open shell/subsystem sessions per network connection
hardening_ssh_max_sessions: 2

# Network interface on the local VM target configured in Step 2
hardening_vm_interface: "{{ vm_interface | default('ens33') }}"

# Static IPv4 address and CIDR prefix for the local VM
hardening_vm_static_ip: "{{ vm_static_ip | default('192.168.1.50/24') }}"

# Default gateway IPv4 address for the local VM
hardening_vm_gateway: "{{ vm_gateway | default('192.168.1.1') }}"

# Upstream DNS resolver IPv4 addresses for the local VM
hardening_vm_dns_servers: "{{ vm_dns_servers | default(['1.1.1.1', '8.8.8.8']) }}"

# UDP listen port for the WireGuard VPN service configured in Step 5
hardening_wireguard_port: "{{ wireguard_port | default(51820) }}"

# IPv4 subnet dedicated to the WireGuard VPN overlay network
hardening_wireguard_vpn_subnet: "{{ wireguard_vpn_subnet | default('10.8.0.0/24') }}"

# WireGuard VPN IP assigned to the host server interface (wg0)
hardening_wireguard_server_vpn_ip: "{{ wireguard_server_vpn_ip | default('10.8.0.1/24') }}"

# WireGuard VPN IP assigned to the management Mac workstation peer
hardening_wireguard_mac_vpn_ip: "{{ wireguard_mac_vpn_ip | default('10.8.0.2/32') }}"
hardening_wireguard_vm_vpn_ip: "{{ wireguard_vm_vpn_ip | default('10.8.0.3/32') }}"

# WireGuard peer public keys mapped by identifier
hardening_wireguard_peer_public_keys: "{{ wireguard_peer_public_keys | default({}) }}"

# Local LAN CIDR permitted to access administrative services
hardening_lan_trusted_cidr: "{{ lan_trusted_cidr | default('192.168.1.0/24') }}"

# Unnecessary daemon services disabled in Step 7 attack surface reduction
hardening_services_to_disable:
  - "cups"
  - "cups-browsed"
  - "avahi-daemon"

# Unnecessary services masked to prevent activation by dependencies or sockets
hardening_services_to_mask:
  - "cups"
  - "cups-browsed"
  - "avahi-daemon"

# Legacy or high-risk networking packages purged from the system in Step 7
hardening_packages_to_purge:
  - "telnet"
  - "rsh-client"
  - "talk"
  - "xinetd"
  - "nis"

# Unused network protocols blacklisted in modprobe to prevent kernel auto-loading
hardening_kernel_modules_blacklist:
  - "dccp"
  - "sctp"
  - "rds"
  - "tipc"
  - "cramfs"
  - "freevxfs"
  - "jffs2"
  - "hfs"
  - "hfsplus"
  - "udf"

# User creation and authentication parameters for /etc/login.defs in Step 8
hardening_login_defs_umask: "027"
hardening_login_defs_pass_max_days: 90
hardening_login_defs_pass_min_days: 7
hardening_login_defs_pass_warn_age: 14
hardening_login_defs_sha_crypt_rounds: 5000

# Auditd immutable flag (-e 2) toggle. Enabled only on production convergence runs.
hardening_auditd_immutable_mode: false

# Lynis minimum Hardening Index threshold expected for VM target
hardening_lynis_min_index_vm: 88

# Lynis minimum Hardening Index threshold expected for EC2 target
hardening_lynis_min_index_ec2: 90
