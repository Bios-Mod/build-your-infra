# Deploy to:   vm:ec2
# Apply:       ansible-playbook playbooks/hardening.yml [--tags <tag>] [--check --diff] --ask-become-pass
# Module:      hardening
# Requires:    none
#
# Task orchestration entry point for the hardening role.
# Why:         Structures execution into Block 2A, Block 2B, and Block 2C stages.
# Doc ref:     modules/hardening/self-managed/hardening-self-managed.md — Steps 0 to 12
# Targets:     both

---
# ==============================================================================
# Block 2A — Preparation Tasks (Steps 0, 1, 2)
# ==============================================================================

# Step 0 — Admin User Setup (Lockout prevention prerequisite)
- name: "Step 0 — Admin user setup"
  ansible.builtin.import_tasks: step_00_admin_user.yml
  tags:
    - hardening_2a
    - hardening_step0

# Step 1 — System Update & Automated Security Upgrades
- name: "Step 1 — System update & automated security upgrades"
  ansible.builtin.import_tasks: step_01_updates.yml
  tags:
    - hardening_2a
    - hardening_step1

# Step 2 — Static IP Configuration (VM only)
- name: "Step 2 — Static IP configuration"
  ansible.builtin.import_tasks: step_02_static_ip.yml
  tags:
    - hardening_2a
    - hardening_step2

# ==============================================================================
# Block 2B — Access Chain (Steps 3, 4, 5, 6)
# ==============================================================================

# Step 3 — SSH Hardening
- name: "Step 3 — SSH hardening"
  ansible.builtin.import_tasks: step_03_ssh.yml
  tags:
    - hardening_2b
    - hardening_step3

# Step 4 — UFW Firewall
- name: "Step 4 — UFW firewall"
  ansible.builtin.import_tasks: step_04_ufw.yml
  tags:
    - hardening_2b
    - hardening_step4

# Step 5 — WireGuard VPN
- name: "Step 5 — WireGuard VPN"
  ansible.builtin.import_tasks: step_05_wireguard.yml
  tags:
    - hardening_2b
    - hardening_step5

# Step 6 — Fail2Ban
- name: "Step 6 — Fail2Ban"
  ansible.builtin.import_tasks: step_06_fail2ban.yml
  tags:
    - hardening_2b
    - hardening_step6

# ==============================================================================
# Block 2C — System Hardening & Compliance (Steps 7 to 12)
# ==============================================================================

# Step 7 — Kernel Hardening (sysctl)
- name: "Step 7 — Kernel hardening (sysctl)"
  ansible.builtin.import_tasks: step_07_sysctl.yml
  tags:
    - hardening_2c
    - hardening_step7

# Step 8 — AppArmor
- name: "Step 8 — AppArmor"
  ansible.builtin.import_tasks: step_08_apparmor.yml
  tags:
    - hardening_2c
    - hardening_step8

# Step 9.1 — Attack Surface Reduction: Services & Daemons
- name: "Step 9.1 — Attack surface reduction: services & daemons"
  ansible.builtin.import_tasks: step_09_1_services.yml
  tags:
    - hardening_2c
    - hardening_step9_1

# Step 9.2 — Attack Surface Reduction: Filesystem & User Hardening
- name: "Step 9.2 — Attack surface reduction: filesystem & user hardening"
  ansible.builtin.import_tasks: step_09_2_users_fs.yml
  tags:
    - hardening_2c
    - hardening_step9_2

# Step 9.3 — Attack Surface Reduction: Kernel Modules
- name: "Step 9.3 — Attack surface reduction: kernel modules"
  ansible.builtin.import_tasks: step_09_3_modprobe.yml
  tags:
    - hardening_2c
    - hardening_step9_3

# Step 9.4 — Attack Surface Reduction: Monitoring & Forensics
- name: "Step 9.4 — Attack surface reduction: monitoring & forensics"
  ansible.builtin.import_tasks: step_09_4_monitoring.yml
  tags:
    - hardening_2c
    - hardening_step9_4

# Step 10 — Audit Trail (auditd + AIDE)
- name: "Step 10 — Audit trail (auditd + AIDE)"
  ansible.builtin.import_tasks: step_10_audit.yml
  tags:
    - hardening_2c
    - hardening_step10

# Step 11 — Log Management (rsyslog + logrotate)
- name: "Step 11 — Log management (rsyslog + logrotate)"
  ansible.builtin.import_tasks: step_11_logging.yml
