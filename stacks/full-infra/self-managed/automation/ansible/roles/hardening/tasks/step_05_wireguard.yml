# Deploy to:   vm:ec2
# Apply:       ansible-playbook playbooks/hardening.yml --tags hardening_step5 [--check --diff] --ask-become-pass
# Module:      hardening
# Requires:    Step 4 completed (UFW enabled)
#
# Step 5 — WireGuard VPN perimeter deployment, peer configuration, and UFW tunnel rules.
# Why:         Creates an encrypted network perimeter hiding SSH behind cryptographic key exchange.
# Doc ref:     modules/hardening/self-managed/hardening-self-managed.md — Step 5
# Targets:     both

---
# Installs WireGuard kernel tools and userspace utilities (Step 5)
- name: Install WireGuard package
  ansible.builtin.apt:
    name: wireguard
    state: present

# Ensures WireGuard configuration directory exists with restrictive permissions (Step 5)
- name: Ensure WireGuard directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

# Generates host WireGuard private key idempotently if not already generated on disk (Step 5)
- name: Generate WireGuard private key
  ansible.builtin.shell:
    cmd: "set -o pipefail && umask 077; wg genkey | tee /etc/wireguard/server_private.key"
    creates: /etc/wireguard/server_private.key
    executable: /bin/bash
  no_log: true

# Generates host WireGuard public key from private key (Step 5)
- name: Generate WireGuard public key
  ansible.builtin.shell:
    cmd: "set -o pipefail && wg pubkey < /etc/wireguard/server_private.key > /etc/wireguard/server_public.key"
    creates: /etc/wireguard/server_public.key
    executable: /bin/bash
  when: not ansible_check_mode

# Sets permissions on WireGuard public key (Step 5)
- name: Set permissions on WireGuard public key
  ansible.builtin.file:
    path: /etc/wireguard/server_public.key
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

# Reads host WireGuard public key to present to operator without exposing private material (Step 5)
- name: Read WireGuard public key
  ansible.builtin.slurp:
    src: /etc/wireguard/server_public.key
  register: hardening_wg_public_key_b64
  when: not ansible_check_mode

# Displays WireGuard public key for inventory and client template population (Step 5)
- name: Display host WireGuard public key
  ansible.builtin.debug:
    msg: "WireGuard Public Key for {{ inventory_hostname }}: {{ hardening_wg_public_key_b64.content | b64decode | trim }}"
  when:
    - not ansible_check_mode
    - hardening_wg_public_key_b64 is defined
    - hardening_wg_public_key_b64.content is defined

# Slurps local private key for template insertion without logging (Step 5)
- name: Slurp local WireGuard private key
  ansible.builtin.slurp:
    src: /etc/wireguard/server_private.key
  register: hardening_wg_private_key_b64
  no_log: true
  when: not ansible_check_mode

# Validates that Mac peer public key is valid base64 and not a placeholder before hub deployment (Step 5)
- name: Assert WireGuard Mac peer public key format
  ansible.builtin.assert:
    that:
      - hardening_wireguard_peer_public_keys is defined
      - hardening_wireguard_peer_public_keys.mac is defined
      - "'CHANGE_ME' not in hardening_wireguard_peer_public_keys.mac"
      - "'<' not in hardening_wireguard_peer_public_keys.mac"
      - "'>' not in hardening_wireguard_peer_public_keys.mac"
      - hardening_wireguard_peer_public_keys.mac | length == 44
      - hardening_wireguard_peer_public_keys.mac is match('^[A-Za-z0-9+/]{43}=$')
    fail_msg: >-
      WireGuard hub deployment aborted: 'wireguard_peer_public_keys.mac' is missing, contains placeholder
      text ('CHANGE_ME', '<', '>'), or is not a valid 44-character base64 WireGuard public key.
      Configure your Mac workstation's public key in 'host_vars/multi-lab-vps.yml' before deploying Step 5.
  when: hardening_wireguard_role == 'hub' # EC2 only

# Evaluates validity of Local VM WireGuard public key and renders hub configuration content in memory (EC2 only) (Step 5)
- name: Render WireGuard hub configuration
  vars:
    hardening_wg_priv: "{{ (hardening_wg_private_key_b64.content | default('')) | b64decode | trim }}"
    hardening_wg_mac_peer: "{{ hardening_wireguard_peer_public_keys.mac | default('') }}"
    hardening_wg_local_vm: "{{ hardening_wireguard_peer_public_keys.local_vm | default('') }}"
    hardening_wg_eol: "\n"
    hardening_wg_base: >-
      {{ lookup('file', hardening_configs_dir ~ '/wireguard/wg0.conf')
         | replace('<server-private-key>', hardening_wg_priv)
         | replace('<mac-public-key>', hardening_wg_mac_peer)
         | trim }}
    hardening_wg_vm_block: >-
      {{ (hardening_wg_eol ~ hardening_wg_eol ~
          '# Local VM' ~ hardening_wg_eol ~
          '[Peer]' ~ hardening_wg_eol ~
          'PublicKey  = ' ~ hardening_wg_local_vm ~ hardening_wg_eol ~
          'AllowedIPs = 172.16.0.3/32')
         if (hardening_wg_local_vm != '' and
             'CHANGE_ME' not in hardening_wg_local_vm and
             '<' not in hardening_wg_local_vm and
             '>' not in hardening_wg_local_vm and
             (hardening_wg_local_vm | length == 44) and
             (hardening_wg_local_vm is match('^[A-Za-z0-9+/]{43}=$')))
         else '' }}
  ansible.builtin.set_fact:
    hardening_wg_vm_peer_is_valid: >-
      {{ hardening_wg_local_vm != '' and
         'CHANGE_ME' not in hardening_wg_local_vm and
         '<' not in hardening_wg_local_vm and
         '>' not in hardening_wg_local_vm and
         (hardening_wg_local_vm | length == 44) and
         (hardening_wg_local_vm is match('^[A-Za-z0-9+/]{43}=$')) }}
    hardening_wg_hub_content: "{{ (hardening_wg_base ~ hardening_wg_vm_block) ~ hardening_wg_eol }}"
  no_log: true
  when: hardening_wireguard_role == 'hub' # EC2 only

# Asserts that rendered WireGuard hub configuration contains expected peer public keys preventing silent peer omission (EC2 only) (Step 5)
- name: Assert WireGuard hub peers are rendered in configuration
  ansible.builtin.assert:
    that:
      - hardening_wireguard_peer_public_keys.mac in hardening_wg_hub_content
      - >-
        (not hardening_wg_vm_peer_is_valid) or
        ((hardening_wireguard_peer_public_keys.local_vm | default('')) in hardening_wg_hub_content)
    fail_msg: >-
      WireGuard hub configuration verification failed: rendered /etc/wireguard/wg0.conf is missing
      required peer public keys. Mac peer public key must be present; Local VM peer public key
      must be present whenever 'wireguard_peer_public_keys.local_vm' is valid.
  no_log: true
  when: hardening_wireguard_role == 'hub' # EC2 only

# Deploys WireGuard server hub configuration (EC2 only) (Step 5)
- name: Deploy WireGuard hub configuration (EC2)
  ansible.builtin.copy:
    content: "{{ hardening_wg_hub_content }}"
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify:
    - Restart wireguard
  when:
    - hardening_wireguard_role == 'hub' # EC2 only
    - not ansible_check_mode

# VM only
# Validates WireGuard hub public key and endpoint format before deploying client configuration (Step 5)
- name: Assert WireGuard client hub parameters format
  ansible.builtin.assert:
    that:
      - hardening_wireguard_hub_public_key is defined
      - hardening_wireguard_hub_public_key | length == 44
      - hardening_wireguard_hub_public_key is match('^[A-Za-z0-9+/]{43}=$')
      - "'CHANGE_ME' not in hardening_wireguard_hub_public_key"
      - "'<' not in hardening_wireguard_hub_public_key"
      - "'>' not in hardening_wireguard_hub_public_key"
      - hardening_wireguard_endpoint is defined
      - hardening_wireguard_endpoint | length > 0
      - "'CHANGE_ME' not in hardening_wireguard_endpoint"
      - "'<' not in hardening_wireguard_endpoint"
      - "'>' not in hardening_wireguard_endpoint"
      - hardening_wireguard_endpoint is match('^[^:\s]+:[0-9]{1,5}$')
      - (hardening_wireguard_endpoint.split(':')[0]) != (vm_lan_ip | default(''))
      - (hardening_wireguard_endpoint.split(':')[0]) != ((vm_static_ip | default('')).split('/')[0])
    fail_msg: >-
      WireGuard client deployment aborted: 'wireguard_hub_public_key' or 'wireguard_endpoint' is missing,
      empty, invalid, contains placeholder text ('CHANGE_ME', '<', '>'), does not match 'host:port' format,
      or 'wireguard_endpoint' erroneously points to the local VM address instead of the EC2 hub public endpoint.
      Configure 'wireguard_hub_public_key' and 'wireguard_endpoint' (<ec2_eip>:51820) in 'host_vars/multi-lab-local.yml' before deploying Step 5.
  when: hardening_wireguard_role == 'client' # VM only

# VM only
# Deploys WireGuard client configuration (Local VM only) (Step 5)
- name: Deploy WireGuard client configuration (VM)
  vars:
    hardening_wg_priv: "{{ (hardening_wg_private_key_b64.content | default('')) | b64decode | trim }}"
    hardening_wg_vm_ip: "{{ hardening_wireguard_vm_vpn_ip if '/' in hardening_wireguard_vm_vpn_ip else (hardening_wireguard_vm_vpn_ip ~ '/32') }}"
    hardening_wg_endpoint_fmt: "{{ hardening_wireguard_endpoint if ':' in hardening_wireguard_endpoint else (hardening_wireguard_endpoint ~ ':51820') }}"
  ansible.builtin.copy:
    content: >-
      {{ lookup('file', hardening_configs_dir ~ '/wireguard/client-template.conf')
         | replace('172.16.0.X/32', hardening_wg_vm_ip)
         | replace('<client-private-key>', hardening_wg_priv)
         | replace('<server-public-key>', hardening_wireguard_hub_public_key)
         | replace('<server-ip-or-domain>:51820', hardening_wg_endpoint_fmt) }}
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify:
    - Restart wireguard
  when:
    - hardening_wireguard_role == 'client' # VM only
    - not ansible_check_mode

# Deploys sysctl configuration to enable IPv4 packet forwarding for WireGuard routing (Step 5)
- name: Deploy WireGuard sysctl ip_forward configuration
  ansible.builtin.copy:
    src: "{{ hardening_configs_dir }}/sysctl/99-wireguard.conf"
    dest: /etc/sysctl.d/99-wireguard.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload sysctl

# Ensures WireGuard tunnel service wg-quick@wg0 is enabled and started (Step 5)
- name: Ensure WireGuard wg-quick@wg0 service is enabled and started
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    state: started
    enabled: true

# Allows inbound WireGuard UDP traffic on VPN listening port (Step 5)
- name: Allow WireGuard UDP traffic in UFW
  community.general.ufw:
    rule: allow
    port: "{{ hardening_wireguard_port | string }}"
    proto: udp
    comment: "WireGuard VPN"

# Restricts SSH access exclusively to WireGuard tunnel interface wg0 (Step 5)
- name: Allow SSH inbound exclusively via WireGuard interface in UFW
  community.general.ufw:
    rule: allow
    direction: in
    interface: wg0
    to_port: "{{ hardening_ssh_port | string }}"
    proto: tcp
    comment: "SSH via WireGuard only"

# Allows peer-to-peer forwarded traffic between WireGuard clients on hub (EC2 only) (Step 5)
- name: Allow peer-to-peer WireGuard routed forwarding in UFW (hub only)
  community.general.ufw:
    route: true
    rule: allow
    interface_in: wg0
    interface_out: wg0
    comment: "WireGuard peer-to-peer forwarding"
  when: hardening_wireguard_role == 'hub' # EC2 only

# WARNING: Lockout risk. Do not delete public rate-limited rule until tunnel connectivity is fully tested from the control node.
# Deletes public rate-limited SSH rule only when explicitly confirmed by operator (Step 5)
- name: Remove public rate-limited SSH rule after tunnel verification
  community.general.ufw:
    rule: limit
    port: "{{ hardening_ssh_port | string }}"
    proto: tcp
    delete: true
  when: hardening_wg_close_public_ssh
