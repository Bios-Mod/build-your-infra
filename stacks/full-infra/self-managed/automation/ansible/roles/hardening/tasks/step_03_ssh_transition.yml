# Deploy to:   vm:ec2
# Apply:       included dynamically by step_03_ssh.yml when connection_mode == 'pre'
# Module:      hardening
# Requires:    Step 3 OpenSSH daemon configured and restarted on port 22222
#
# Transitions SSH connection from bootstrap port 22 to hardened port 22222.
# Why:         Isolates meta reset_connection inside conditional include to prevent unconditional execution in ansible-core 2.21.
# Doc ref:     modules/hardening/self-managed/hardening-self-managed.md — Step 3
# Targets:     both

---
# WARNING: EC2 requirement. Security Group 'multi-lab-sg' MUST allow port 22222 (via ssh_hardened_cidr) before switching connection_mode to 'hardened'.
# Updates connection mode dynamically to test connectivity on hardened SSH port 22222 (Step 3)
- name: Switch connection mode to hardened port
  ansible.builtin.set_fact:
    connection_mode: "hardened" # noqa: var-naming[no-role-prefix]

# Resets current SSH control master connection to force renegotiation on port 22222 (Step 3)
- name: Reset SSH connection to rebind to hardened port
  ansible.builtin.meta: reset_connection

# Waits for SSH reachability on hardened port 22222 to confirm successful transition (Step 3)
- name: Wait for SSH reachability on hardened port 22222
  ansible.builtin.wait_for_connection:
    delay: 3
    timeout: 60
  become: false
