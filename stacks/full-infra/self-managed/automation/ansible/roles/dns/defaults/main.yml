# Deploy to:   dns_servers
# Apply:       included automatically when role 'dns' is invoked
# Module:      dns
# Requires:    none
#
# Default variable definitions for the dns role.
# Why:         Provides baseline defaults for source config paths and hardening pre-flight verification.
# Doc ref:     modules/dns/self-managed/dns-self-managed.md
# Targets:     ec2

---
# Root directory containing the source-of-truth dns configs
dns_configs_dir: "{{ configs_root }}/dns/self-managed/configs"

# Hardened OpenSSH daemon port configured by the hardening baseline
hardening_ssh_port: "{{ ssh_hardened_port | default(22222) }}"  # noqa: var-naming[no-role-prefix]

# Internal VPC domain forwarded to VPC resolver and excluded from DNSSEC validation
dns_vpc_domain: "compute.internal"

# Reverse lookup zone for the 10.0.0.0/16 VPC network; PTR records of VPC hosts
dns_vpc_reverse_domain: "10.in-addr.arpa"

# AWS VPC resolver address used as upstream forwarder for internal VPC domain queries
dns_vpc_resolver: "10.0.0.2"

# Semicolon-terminated list of IPv4 listen-on addresses for BIND9; default 'any;' matches manual configuration
# Set to '127.0.0.1; 172.16.0.1;' in host_vars when coexisting with Samba 4 AD DC to free the EC2 private IP on port 53
dns_listen_on: "any;"

# Mirrors the hardening role default so the audit drop-in logic is correct on hosts that do not override it; VM overrides it to false in group_vars/vm.yml
hardening_auditd_immutable_mode: true  # noqa: var-naming[no-role-prefix]

# Note: dns_auditd_reboot has NO default value by design when hardening_auditd_immutable_mode is true.
# It must be defined explicitly in host_vars (e.g. inventories/host_vars/multi-lab-vps.yml).
