# Deploy to:   vm:ec2
# Apply:       triggered via notify from web-server tasks
# Module:      web-server
# Requires:    none
#
# Service handlers for the web-server role.
# Why:         Ensures affected daemons (nginx), integrity baselines (AIDE), and audit rules absorb changes idempotently.
# Doc ref:     modules/web-server/self-managed/web-server-self-managed.md — Steps 1, 3, 5, 6
# Targets:     both

---
# Reloads Nginx web server daemon to apply updated virtual host configurations (Steps 1, 3)
- name: Reload nginx (web-server)
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

# Validates AIDE configuration syntax before database regeneration (Step 6)
- name: Validate AIDE configuration syntax (web-server)
  ansible.builtin.command:
    cmd: aide --config-check --config /etc/aide/aide.conf
  changed_when: false
  when: not ansible_check_mode
  listen: Regenerate AIDE database (web-server)

# Initializes updated AIDE database baseline for web-server configuration and certificate paths (Step 6)
- name: Initialize AIDE database (web-server)
  ansible.builtin.command:
    cmd: aide --init --config /etc/aide/aide.conf
  register: web_server_aide_init
  failed_when: web_server_aide_init.rc not in [0, 17]
  changed_when: true
  when: not ansible_check_mode
  listen: Regenerate AIDE database (web-server)

# Activates the newly initialized AIDE database baseline (Step 6)
- name: Activate AIDE database (web-server)
  ansible.builtin.command:
    cmd: mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db
  changed_when: true
  when: not ansible_check_mode
  listen: Regenerate AIDE database (web-server)

# Loads auditd rules directly when host is not in immutable mode (Step 5)
- name: Load auditd rules with augenrules (web-server)
  ansible.builtin.command:
    cmd: augenrules --load
  changed_when: true
  when:
    - not ansible_check_mode
    - not (hardening_auditd_immutable_mode | default(false))
  listen: Load auditd rules (web-server)

# WARNING: Rebooting the host terminates the active WireGuard tunnel. Re-establish the tunnel before reconnecting.
# After reboot, verify systemd-resolved DNS resolver status via 'resolvectl status' / 'Current DNS Server: 127.0.0.1'.
# Reboots host to load updated auditd rules when kernel is running in immutable mode (-e 2) (Step 5)
- name: Reboot host to apply immutable auditd rules (web-server)
  ansible.builtin.reboot:
    reboot_timeout: 600
  when:
    - not ansible_check_mode
    - hardening_auditd_immutable_mode | default(false)
    - web_server_auditd_reboot | default(false)
  listen: Load auditd rules (web-server)

# Emits warning notification when audit rules changed in immutable mode but automated reboot is disabled (Step 5)
- name: Warn reboot required for immutable auditd rules (web-server)
  ansible.builtin.debug:
    msg: >-
      Auditd rules in /etc/audit/rules.d/99-zz-web-server.rules were updated, but the kernel is in immutable
      mode (-e 2) and 'web_server_auditd_reboot' is false. A manual reboot is required to load the new audit rules.
  when:
    - not ansible_check_mode
    - hardening_auditd_immutable_mode | default(false)
    - not (web_server_auditd_reboot | default(false))
  listen: Load auditd rules (web-server)
