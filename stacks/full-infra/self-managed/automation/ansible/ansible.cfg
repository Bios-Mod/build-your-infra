# Deploy to:   local control node (Mac)
# Apply:       ansible / ansible-playbook (read automatically from project directory)
# Module:      stacks/full-infra/self-managed/automation/ansible
# Requires:    none
#
# Ansible engine configuration for the self-managed infrastructure stack.
# Parameters modified from baseline: see inline comments per section.

[defaults]
# Default inventory file path
inventory = inventories/hosts.yml

# Roles location: all self-managed roles reside in the stack roles/ directory
roles_path = roles

# Smart gathering: cache facts during playbook run rather than re-querying
gathering = smart

# Use clean, readable YAML output callback for playbooks and diffs
stdout_callback = ansible.builtin.default

[callback_default]
result_format = yaml

# Parallel process count for target host execution
forks = 5

# Enforce strict SSH host key checking — never disable in security-first labs
host_key_checking = True

# Disable .retry files creation in the working directory
retry_files_enabled = False

[privilege_escalation]
# Privilege escalation defaults — privilege escalation disabled by default
become = False
become_method = sudo

[ssh_connection]
# Pipelining reduces the number of SSH operations to improve playbook performance
pipelining = True

# SSH multiplexing configuration for persistent control sockets
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s
