# Deploy to:   vm group (multi-lab-local)
# Apply:       included automatically by Ansible for hosts in the 'vm' group
# Module:      stacks/full-infra/self-managed/automation/ansible
# Requires:    none
#
# Group variables for local virtualization environment (VMware / VirtualBox).
# Why:         Defines environment identity, connection defaults, TLS mode, and audit policy.
# Doc ref:     context/ansible-implementation.md — Section 4
# Targets:     vm

---
# Environment identity flag
is_cloud: false

# Connection phase selector
connection_mode: "local"

# TLS certificate strategy for Nginx web server (Step 6 of full infra)
tls_mode: "internal"

# Disable auditd immutable mode (-e 2) during development to allow rule reloading without rebooting
hardening_auditd_immutable_mode: false

# Ansible connection parameters
ansible_host: "{{ vm_lan_ip }}"
ansible_port: 22
ansible_user: "{{ admin_username }}"

# WireGuard overlay network parameters
vm_wg0_ip: "10.10.0.1/24"
wireguard_endpoint: "{{ vm_lan_ip }}:51820"
