# Deploy to:   vm group (multi-lab-local)
# Apply:       included automatically by Ansible for hosts in the 'vm' group
# Module:      stacks/full-infra/self-managed/automation/ansible
# Requires:    none
#
# Group variables for local virtualization environment (VMware / VirtualBox).
# Why:         Defines environment identity, connection mode, TLS mode, and audit policy.
# Doc ref:     stacks/full-infra/self-managed/automation/self-managed-automation.md
# Targets:     vm

---
# Environment identity flag
is_cloud: false

# Connection phase selector:
# 'pre'      -> Initial connection: LAN IP (vm_lan_ip), default SSH port 22, installer user (vm_initial_user).
# 'hardened' -> Hardened SSH: LAN IP (vm_lan_ip), hardened port 22222 (ssh_hardened_port), admin user (admin_username).
# 'wg'       -> WireGuard perimeter: VPN tunnel IP (vm_wg0_ip = 172.16.0.3), port 22222, admin user.
connection_mode: "pre"

# Dynamic target host IP driven by connection phase (LAN IP in 'pre' and 'hardened', WireGuard tunnel IP in 'wg')
ansible_host: "{{ vm_wg0_ip if connection_mode == 'wg' else vm_lan_ip }}"

# Target SSH listening port (22 during bootstrap in 'pre', hardened port 22222 in 'hardened' and 'wg')
ansible_port: "{{ 22 if connection_mode == 'pre' else ssh_hardened_port }}"

# Remote user for SSH connection (installer user in 'pre', dedicated admin in 'hardened' and 'wg')
ansible_user: "{{ vm_initial_user if connection_mode == 'pre' else admin_username }}"

# TLS certificate strategy for Nginx web server (Step 6 of full infra)
tls_mode: "self_signed"

# WireGuard VPN tunnel IP assigned to the local VM peer (172.16.0.3)
vm_wg0_ip: "{{ wireguard_vm_vpn_ip }}"

# Disable auditd immutable mode (-e 2) during development to allow rule reloading without rebooting
hardening_auditd_immutable_mode: false
