# Deploy to:   /etc/systemd/system/prometheus-node-exporter.service.d/wg0-ordering.conf
# Apply:       sudo mkdir -p /etc/systemd/system/prometheus-node-exporter.service.d && sudo cp ~/build-your-infra/modules/monitoring/self-managed/configs/node-exporter/wg0-ordering.conf /etc/systemd/system/prometheus-node-exporter.service.d/wg0-ordering.conf && sudo systemctl daemon-reload
# Module:      monitoring
# Requires:    modules/hardening/ — wg-quick@wg0.service enabled
#
# Systemd drop-in ordering prometheus-node-exporter after WireGuard wg0 (EC2 only).
# Parameters modified from baseline:  adds After=wg-quick@wg0.service and Wants=wg-quick@wg0.service
#
# Platform:    Ubuntu 24.04 LTS · EC2 (multi-lab-vps)
# Purpose:     Ensures 172.16.0.1 is assigned on wg0 before node_exporter binds on boot.

[Unit]
After=wg-quick@wg0.service
Wants=wg-quick@wg0.service

