# Deploy to:   /etc/systemd/system/grafana-server.service.d/override.conf
# Apply:       sudo mkdir -p /etc/systemd/system/grafana-server.service.d && sudo cp ~/build-your-infra/modules/monitoring/self-managed/configs/grafana/grafana-override.conf /etc/systemd/system/grafana-server.service.d/override.conf && sudo sed -i 's/<vm_wg_ip>/172.16.0.3/' /etc/systemd/system/grafana-server.service.d/override.conf && sudo systemctl daemon-reload && sudo systemctl restart grafana-server
# Module:      monitoring
# Requires:    modules/hardening/ — wg-quick@wg0.service enabled and active
#
# Systemd drop-in ordering grafana-server after WireGuard and binding HTTP to WireGuard IP.
# Parameters modified from baseline:  adds wg0 ordering and sets GF_SERVER_HTTP_ADDR / GF_SERVER_HTTP_PORT
#
# Platform:    Ubuntu 24.04 LTS · Local VM (multi-lab-local)
# Note:        VM (multi-lab-local) only. Substitute <vm_wg_ip> with sed on the deployed copy /etc/systemd/system/grafana-server.service.d/override.conf — never edit the repository file.

[Unit]
After=wg-quick@wg0.service
Wants=wg-quick@wg0.service

[Service]
Environment=GF_SERVER_HTTP_ADDR=<vm_wg_ip>
Environment=GF_SERVER_HTTP_PORT=3000
